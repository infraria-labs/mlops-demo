apiVersion: k3d.io/v1alpha5
kind: Simple
metadata:
  name: meteo-mlops
servers: 1
agents: 0
image: rancher/k3s:v1.33.9-k3s1
kubeAPI:
  hostIP: 127.0.0.1
options:
  k3s:
    extraArgs:
    - arg: --disable=traefik
      nodeFilters:
      - server:*
  kubeconfig:
    updateDefaultKubeconfig: false
    switchCurrentContext: false
