apiVersion: apps/v1
kind: Deployment
metadata:
  name: inference
  namespace: meteo-mlops
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: inference
  template:
    metadata:
      labels:
        app: inference
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: inference
        image: meteo-inference:k3d-v1
        imagePullPolicy: Never
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        resources:
          requests:
            cpu: 100m
            memory: 256Mi
          limits:
            cpu: '2'
            memory: 1Gi
        env:
        - name: MODEL_PATH
          valueFrom:
            configMapKeyRef:
              name: runtime-config
              key: MODEL_PATH
        ports:
        - name: http
          containerPort: 8000
        volumeMounts:
        - name: model
          mountPath: /models
          readOnly: true
        startupProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
      volumes:
      - name: model
        secret:
          secretName: inference-model
          defaultMode: 292
---
apiVersion: v1
kind: Service
metadata:
  name: inference
  namespace: meteo-mlops
spec:
  selector:
    app: inference
  ports:
  - name: http
    port: 8000
    targetPort: http
