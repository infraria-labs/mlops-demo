version: 2
# Keep vulnerability fixes enabled without routine version-update PRs.
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: uv
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
  - package-ecosystem: terraform
    directories:
      - /infra/terraform
      - /infra/eks
    schedule:
      interval: weekly
    open-pull-requests-limit: 0
