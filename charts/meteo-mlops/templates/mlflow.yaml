apiVersion: apps/v1
kind: Deployment
metadata:
  name: mlflow
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: mlflow
  template:
    metadata:
      labels:
        app: mlflow
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/config.yaml") . | sha256sum }}
    spec:
      serviceAccountName: {{ .Values.mlflow.serviceAccount.name }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
      - name: mlflow
        image: {{ include "meteo.image" (dict "image" .Values.images.inference) | quote }}
        imagePullPolicy: {{ .Values.images.pullPolicy }}
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml .Values.resources.mlflow | nindent 10 }}
        command:
        - mlflow
        - server
        - --host
        - 0.0.0.0
        - --port
        - '5000'
        - --workers
        - '1'
        - --backend-store-uri
        - sqlite:////mlflow/mlflow.db
        - --serve-artifacts
        - --artifacts-destination
        - {{ required "mlflow.artifactDestination is required" .Values.mlflow.artifactDestination | quote }}
        - --default-artifact-root
        - mlflow-artifacts:/
        ports:
        - name: http
          containerPort: 5000
        volumeMounts:
        - name: state
          mountPath: /mlflow
        - name: tmp
          mountPath: /tmp
        startupProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 60
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 6
        env:
        - name: AWS_DEFAULT_REGION
          value: {{ .Values.region | quote }}
      volumes:
      - name: state
        persistentVolumeClaim:
          claimName: mlflow-data
      - name: tmp
        emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: mlflow
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  selector:
    app: mlflow
  ports:
  - name: http
    port: 5000
    targetPort: http
