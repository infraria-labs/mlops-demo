apiVersion: apps/v1
kind: Deployment
metadata:
  name: monitoring-kube-state-metrics
  namespace: '{{ .Release.Namespace }}'
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: monitoring-kube-state-metrics
  template:
    metadata:
      labels:
        app: monitoring-kube-state-metrics
      annotations:
        checksum/config: '{{ include (print $.Template.BasePath "/config.yaml") .
          | sha256sum }}'
    spec:
      automountServiceAccountToken: true
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        runAsGroup: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: kube-state-metrics
        image: {{ .Values.kubeStateMetrics.image | quote }}
        args:
        - --namespaces={{ .Release.Namespace }}
        - --resources=pods,deployments,replicasets,jobs,cronjobs
        ports:
        - name: http
          containerPort: 8080
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        resources:
          {{- toYaml (index .Values.resources "kube-state-metrics") | nindent 10 }}
        volumeMounts: []
        env: []
        readinessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 10
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /healthz
            port: http
          initialDelaySeconds: 30
          periodSeconds: 20
      volumes: []
      serviceAccountName: monitoring-kube-state-metrics
---
apiVersion: v1
kind: Service
metadata:
  name: monitoring-kube-state-metrics
  namespace: '{{ .Release.Namespace }}'
spec:
  type: ClusterIP
  selector:
    app: monitoring-kube-state-metrics
  ports:
  - name: http
    port: 8080
    targetPort: http
